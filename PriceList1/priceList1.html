<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./priceList1.css">
  <script src="./priceList1.js" defer></script>
  <title>Price List</title>
</head>

<body>
  <h1 class="title" id="title">Store is open</h1>

  <table id="priceTableId">
    <thead>
      <tr>
        <th>Col1</th>
        <th>Col2</th>
        <th>Col3</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
      </tr>
    </tbody>
  </table>

  <div class="styleCb">
    <input type="checkbox" id="cbStyleId">
    <label for="cbStyleId">Enable styling</label>
  </div>

  <div class="storeStatusRb">
    <input type="radio" name="rbShopStatus" id="rbOpen" checked>
    <label for="rbOpen">Open</label>
    <input type="radio" name="rbShopStatus" id="rbClosed">
    <label for="rbClosed">Closed</label>
  </div>

  <p class="seeYa">See you soon</p>

</body>

</html>
